<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Переменные для быстрой смены цветов */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --timer-bg: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      --timer-border: #dbeafe;
      --timer-text: #1d4ed8;
      --input-text: #334155;
    }

    /* Цвета для тёмной темы */
    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --border-color: #334155;
      --timer-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      --timer-border: #334155;
      --timer-text: #3b82f6;
      --input-text: #e2e8f0;
    }

    body { 
      width: 320px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 20px; 
      margin: 0; 
      background-color: var(--bg-color);
      transition: background-color 0.2s ease;
    }
    
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    h3 { 
      margin-top: 0; 
      margin-bottom: 4px; 
      color: var(--text-main); 
      font-size: 18px;
      font-weight: 700;
    }
    
    .version-tag { 
      font-size: 10px; 
      color: var(--text-muted); 
      margin-bottom: 18px; 
      font-weight: 600; 
      text-transform: uppercase;
      letter-spacing: 1px; 
    }

    /* Кнопка переключения темы */
    .theme-toggle {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      box-shadow: none !important;
    }

    .task-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .task-input { 
      width: 100%; 
      box-sizing: border-box;
      padding: 10px 14px; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 14px;
      color: var(--input-text);
      background-color: var(--card-bg);
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    
    .task-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    
    .timer-box { 
      background: var(--timer-bg);
      padding: 16px; 
      border-radius: 12px; 
      text-align: center; 
      margin-top: 20px; 
      border: 1px solid var(--timer-border);
    }
    
    .timer-display { 
      font-size: 32px; 
      font-weight: 800; 
      color: var(--timer-text); 
      margin-bottom: 6px; 
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    
    .duration-setting {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    
    .minutes-input {
      width: 45px;
      padding: 4px 6px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      color: var(--text-main);
      background-color: var(--card-bg);
      outline: none;
    }
    
    .minutes-input:focus {
      border-color: #3b82f6;
    }
    
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    
    button { 
      background-color: #2563eb; 
      color: white; 
      border: none; 
      padding: 10px 24px; 
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.15s ease;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }
    
    button:hover { 
      background-color: #1d4ed8; 
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .reset-btn {
      background-color: #64748b;
      box-shadow: 0 4px 6px -1px rgba(100, 116, 139, 0.2);
    }
    
    .reset-btn:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div>
      <h3 id="ext-title">🎯 Tasks</h3>
      <div class="version-tag">VERSION: BETA 1</div>
    </div>
    <!-- Кнопка смены темы -->
    <button id="theme-toggle-btn" class="theme-toggle">🌙</button>
  </div>

  <div class="task-container">
    <input type="text" id="task1" class="task-input">
    <input type="text" id="task2" class="task-input">
    <input type="text" id="task3" class="task-input">
  </div>

  <div class="timer-box">
    <div class="timer-display" id="timer">25:00</div>
    
    <div class="duration-setting">
      <input type="number" id="minutes-input" class="minutes-input" value="25" min="1" max="180">
      <span>min</span>
    </div>

    <div class="btn-group">
      <button id="start-btn">Start</button>
      <button id="reset-btn" class="reset-btn">🔄</button>
    </div>
  </div>

  <!-- Ссылка на твой GitHub -->
  <div style="text-align: center; margin-top: 15px; font-size: 11px;">
    <a href="https://github.com" target="_blank" style="color: #64748b; text-decoration: none; font-weight: 600;">🔗 GitHub Open Source</a>
  </div>


  <script src="popup.js"></script>
</body>
</html>
